# ═══════════════════════════════════════════════════════════════════════════
#  musicaolerdola.cat — configuració nginx
#
#  Còpia versionada de /etc/nginx/sites-available/musicaolerdola.cat
#  Per instal·lar-la:
#      sudo cp desplegament/nginx-musicaolerdola.cat.conf \
#              /etc/nginx/sites-available/musicaolerdola.cat
#      sudo nginx -t && sudo systemctl reload nginx
#
#  Les línies marcades «managed by Certbot» les manté ell mateix en renovar
#  el certificat: no les toqueu a mà.
# ═══════════════════════════════════════════════════════════════════════════

server {
    server_name musicaolerdola.cat www.musicaolerdola.cat;

    root /var/www/html/musicaolerdola;
    index index.html;

    charset utf-8;

    # ── Capçaleres de seguretat ────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Adreces amigables ──────────────────────────────────────────────────
    # El QR dels cartells apunta a /enquesta: ha de funcionar sempre.
    location = /enquesta    { try_files /enquesta.html =404; }
    location = /privacitat  { try_files /privacitat.html =404; }
    location = /cartell     { try_files /cartell.html =404; }

    # Panell de resultats amb una adreça fàcil de recordar.
    location = /resultats   { rewrite ^ /api/admin.php last; }

    # ── Zones bloquejades ──────────────────────────────────────────────────
    # El modificador ^~ té prioritat sobre les expressions regulars, de manera
    # que aquests camins mai arriben a l'intèrpret de PHP.
    location ^~ /api/lib/    { deny all; }
    location ^~ /api/vendor/ { deny all; }
    location ^~ /eines/      { deny all; }
    location ^~ /desplegament/ { deny all; }
    location = /api/composer.json      { deny all; }
    location = /api/composer.lock      { deny all; }
    location = /api/config.example.php { deny all; }
    location ~ /\.            { deny all; }

    # ── PHP (només dins /api/) ─────────────────────────────────────────────
    location ~ ^/api/.*\.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 60s;
    }

    # ── Fitxers estàtics ───────────────────────────────────────────────────
    location ~* \.(png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # El JSON de les preguntes i el CSS/JS han de poder canviar sense esperes.
    location ~* \.(css|js|json|webmanifest)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/musicaolerdola.cat/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/musicaolerdola.cat/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.musicaolerdola.cat) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = musicaolerdola.cat) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name musicaolerdola.cat www.musicaolerdola.cat;
    return 404; # managed by Certbot
}
